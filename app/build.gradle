plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Signing secrets stay outside the repo, in %APPDATA%\Secrets\WakeOnNoti\.env
// (plain KEY=value lines, same scheme as UmAi). Without that file - anyone
// building from source - the release build falls back to the debug key. Such an
// APK works, but it cannot update the published one: Android only replaces an
// installed app with an APK signed by the same key, and that in-place update is
// what keeps the user's rules.
def secrets = [:]
def secretsFile = new File((System.getenv("APPDATA") ?: ""), "Secrets/WakeOnNoti/.env")
if (secretsFile.isFile()) {
    secretsFile.readLines().each { line ->
        line = line.trim()
        if (line && !line.startsWith("#") && line.contains("=")) {
            def kv = line.split("=", 2)
            secrets[kv[0].trim()] = kv[1].trim().replaceAll(/^["']|["']$/, "")
        }
    }
}

// VERSION (repo root) is the single source; scripts/publish.ps1 bumps it.
// versionCode must be a monotonic int: 0.1.0 -> 100, 1.2.3 -> 10203
def appVersion = new File(rootDir, "VERSION").text.trim()
def appVersionCode = {
    def p = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/)
    if (!p) throw new GradleException("VERSION ${appVersion} is not x.y.z")
    p[0][1].toInteger() * 10000 + p[0][2].toInteger() * 100 + p[0][3].toInteger()
}()

android {
    namespace 'io.github.niklasvelo.wakeonnoti'
    compileSdk 35

    signingConfigs {
        release {
            if (secrets['WAKEONNOTI_KEYSTORE']) {
                storeFile file(secrets['WAKEONNOTI_KEYSTORE'])
                storePassword secrets['WAKEONNOTI_STORE_PASSWORD']
                keyAlias secrets['WAKEONNOTI_KEY_ALIAS']
                keyPassword secrets['WAKEONNOTI_KEY_PASSWORD']
            } else {
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId 'io.github.niklasvelo.wakeonnoti'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
        // the update channel: the repo itself carries the newest APK + this manifest
        buildConfigField "String", "UPDATE_MANIFEST_URL",
                "\"https://raw.githubusercontent.com/NiklasVelo/WakeOnNoti/main/release/version.json\""
        buildConfigField "String", "REPO_URL", "\"https://github.com/NiklasVelo/WakeOnNoti\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // installs next to the release app, so testing never touches real rules
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
}
